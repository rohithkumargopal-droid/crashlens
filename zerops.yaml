zerops:
  - setup: api

    build:
      base: nodejs@22

      buildCommands:
        - cd api && npm install
        - cd api && npm run build

      deployFiles:
        - api/dist
        - api/package.json
        - api/package-lock.json

    run:
      base: nodejs@22

      ports:
        - port: 3001
          httpSupport: true

      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        PORT: "3001"

      start: node api/dist/index.js