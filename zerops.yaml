zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install
        - cd api && npm run build
      deployFiles:
        - api/dist
        - api/package.json
        - api/src/lib/schema.sql

    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true

      envVariables:
        PORT: "3001"

      start: cd api && npm run start

      initCommands:
        - node api/dist/lib/migrate.js
        - node api/dist/lib/seed.js